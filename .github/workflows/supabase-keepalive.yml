name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST (media table)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing secrets SUPABASE_URL / SUPABASE_ANON_KEY"
            exit 1
          fi
          BASE="${SUPABASE_URL%/}"
          URL="${BASE}/rest/v1/media?select=id&limit=1"
          echo "GET ${URL}"
          CODE=$(curl -sS -o /tmp/sb-keepalive.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "$URL")
          echo "HTTP ${CODE}"
          cat /tmp/sb-keepalive.json || true
          echo
          if [ "$CODE" != "200" ]; then
            echo "Keep-alive failed"
            exit 1
          fi
          echo "Keep-alive OK"
